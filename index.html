<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="健康記錄"><link rel="manifest" href="manifest.json"><title>我的健康記錄</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#1d1d1f}.wrap{max-width:520px;margin:auto;padding:18px 16px 90px}h1{font-size:26px;margin:8px 0 2px}.sub{color:#6e6e73;margin-bottom:18px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}.card h2{font-size:18px;margin:0 0 12px}.row{display:flex;gap:10px}.field{flex:1}label{display:block;font-size:13px;color:#6e6e73;margin-bottom:5px}input{width:100%;font-size:18px;padding:11px;border:1px solid #d2d2d7;border-radius:10px;background:#fff}.unit{font-size:13px;color:#6e6e73;margin-top:5px}.btns{display:flex;gap:10px;margin-top:15px}button{border:0;border-radius:11px;padding:12px 16px;font-size:16px;font-weight:600}.save{background:#007aff;color:#fff;flex:1}.clear{background:#e9e9ed;color:#222}.record{border-top:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;gap:10px}.record:first-of-type{border-top:0}.vals{font-size:15px;line-height:1.6}.time{font-size:12px;color:#777}.del{background:#fff0f0;color:#c00;padding:7px 9px;font-size:13px;height:34px}.empty{color:#777;font-size:14px}.note{font-size:12px;color:#777;text-align:center;margin-top:18px}
</style></head><body><main class="wrap"><h1>我的健康記錄</h1><div class="sub" id="today"></div>
<section class="card"><h2>今日記錄</h2><div class="field"><label>血糖</label><input id="glucose" inputmode="decimal" placeholder="例如 7.0"><div class="unit">mmol/L</div></div><br>
<div class="row"><div class="field"><label>收縮壓</label><input id="sys" inputmode="numeric" placeholder="125"><div class="unit">mmHg</div></div><div class="field"><label>舒張壓</label><input id="dia" inputmode="numeric" placeholder="78"><div class="unit">mmHg</div></div></div><br>
<div class="field"><label>體重</label><input id="weight" inputmode="decimal" placeholder="150"><div class="unit">lb</div></div>
<div class="btns"><button class="save" onclick="save()">儲存記錄</button><button class="clear" onclick="clearForm()">清除</button></div></section>
<section class="card"><h2>最近記錄</h2><div id="records"></div></section>
<div class="note">資料只儲存在這部裝置的瀏覽器內。這是測試版，不作醫療診斷用途。</div></main>
<script>
const $=id=>document.getElementById(id);$('today').textContent=new Intl.DateTimeFormat('zh-HK',{dateStyle:'full'}).format(new Date());
function get(){try{return JSON.parse(localStorage.getItem('healthRecords')||'[]')}catch(e){return[]}}
function clearForm(){['glucose','sys','dia','weight'].forEach(x=>$(x).value='')}
function save(){let r={id:Date.now(),date:new Date().toISOString(),g:$('glucose').value.trim(),s:$('sys').value.trim(),d:$('dia').value.trim(),w:$('weight').value.trim()};if(!r.g&&!r.s&&!r.d&&!r.w){alert('請先輸入至少一項資料');return}let a=get();a.unshift(r);localStorage.setItem('healthRecords',JSON.stringify(a));clearForm();render()}
function del(id){if(confirm('刪除這項記錄？')){localStorage.setItem('healthRecords',JSON.stringify(get().filter(x=>x.id!==id)));render()}}
function render(){let a=get(),el=$('records');if(!a.length){el.innerHTML='<div class="empty">暫時未有記錄。</div>';return}el.innerHTML=a.slice(0,30).map(r=>{let v=[];if(r.g)v.push('血糖 '+esc(r.g)+' mmol/L');if(r.s||r.d)v.push('血壓 '+esc(r.s||'—')+'/'+esc(r.d||'—')+' mmHg');if(r.w)v.push('體重 '+esc(r.w)+' lb');return '<div class="record"><div><div class="vals">'+v.join('<br>')+'</div><div class="time">'+new Date(r.date).toLocaleString('zh-HK')+'</div></div><button class="del" onclick="del('+r.id+')">刪除</button></div>'}).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
